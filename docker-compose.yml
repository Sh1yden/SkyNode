services:
  bot:
    container_name: bot
    build: .
    restart: always
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PROJECT_STATUS=product
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=6432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - UV_SYSTEM_PYTHON=1
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - bot_network

  postgresql:
    container_name: postgresql
    image: postgres:17-alpine
    restart: unless-stopped
    command: -p 6432
    env_file:
      - .env.prod
    ports:
      - "6432:6432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 6432"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bot_network

  redis:
    container_name: redis
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - bot_network

volumes:
  postgres_data:
  redis_data:

networks:
  bot_network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
